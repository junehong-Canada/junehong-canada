<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ title }} – June Hong</title>
  <meta name="description" content="{{ description }}">
  <meta name="author" content="{{ author }}">
  <link rel="icon" type="image/png" href="../assets/images/JHD.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../style.css">
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5789326916093083"
     crossorigin="anonymous"></script>
</head>

<body>

  <!-- Navigation -->
  <nav>
    <div class="nav-inner">
      <a href="../index.html" class="nav-brand">
        <img src="../assets/images/JHD.png" alt="JH" class="monogram" />
        <span>June Hong, Dominicus</span>
      </a>
      <div class="nav-links">
        <a href="../index.html">Home</a>
        <a href="../projects.html">Projects</a>
        <a href="../blog.html">Blog</a>
        <a href="https://github.com/junehong-dominicus" target="_blank">GitHub</a>
        <a href="https://www.linkedin.com/in/junehong-dominicus/" target="_blank">LinkedIn</a>
      </div>
    </div>
  </nav>

  <!-- Article Header -->
  <header class="article-header">
    <h1>{{ title }}</h1>
    <div class="article-meta">
      By {{ author }} • <time>{{ date }}</time>
      <span> • {{ read_time }} min read</span>
    </div>
    {{ tags_html }}
  </header>

  <main>
    <article>
      <!--
      <div style="margin-bottom: 2rem; text-align: center; min-height: 100px;">
        <ins class="adsbygoogle"
             style="display:block"
             data-ad-client="ca-pub-5789326916093083"
             data-ad-slot="1816196154"
             data-ad-format="auto"
             data-full-width-responsive="true"></ins>
        <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
      </div>
      -->
      {{ article_content }}
    </article>
  </main>

  <footer>
    <div class="footer-links">
      <a href="../index.html">Home</a> |
      <a href="../projects.html">Projects</a> |
      <a href="../blog.html">Blog</a> |
      <a href="../marketing.html">Marketing</a> |
      <a href="../privacy-policy.html">Privacy Policy</a>
    </div>

  </footer>

</html>
